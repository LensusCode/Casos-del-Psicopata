<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Casos del Psicópata</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Lora:ital,wght@0,400..700;1,400..700&family=IM+Fell+English+SC&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg-color: #e0dace;
      --paper-color: #f5f1e8;
      --text-color: #2c251c;
      --border-color: #b0a48e;
      --accent-color: #9a3e3e;
      --accent-hover-color: #7a2f2f;
      --title-font: 'IM Fell English SC', serif;
      --body-font: 'Lora', serif;
    }
    body {
      font-family: var(--body-font);
      background-color: var(--bg-color);
      /* Subtle noise and vignette for a vintage feel */
      background-image: 
        radial-gradient(ellipse at center, rgba(0,0,0,0) 0%, rgba(0,0,0,0.1) 100%),
        linear-gradient(rgba(210, 200, 180, 0.6), rgba(210, 200, 180, 0.6)),
        url('data:image/svg+xml,%3Csvg viewBox="0 0 250 250" xmlns="http://www.w3.org/2000/svg"%3E%3Cfilter id="noiseFilter"%3E%3CfeTurbulence type="fractalNoise" baseFrequency="0.65" numOctaves="3" stitchTiles="stitch"/%3E%3C/filter%3E%3Crect width="100%" height="100%" filter="url(%23noiseFilter)"/%3E%3C/svg%3E');
    }
    .font-title {
      font-family: var(--title-font);
    }
    ::-webkit-scrollbar {
      width: 8px;
      height: 8px;
    }
    ::-webkit-scrollbar-track {
      background: #d3c7b1;
    }
    ::-webkit-scrollbar-thumb {
      background: #a3967d;
      border-radius: 4px;
    }
    ::-webkit-scrollbar-thumb:hover {
      background: #8f7f65;
    }
  </style>
<script type="importmap">
{
  "imports": {
    "react/": "https://aistudiocdn.com/react@^19.2.0/",
    "react": "https://aistudiocdn.com/react@^19.2.0",
    "react-dom/": "https://aistudiocdn.com/react-dom@^19.2.0/",
    "@google/genai": "https://aistudiocdn.com/@google/genai@^0.14.0"
  }
}
</script>
</head>
<body class="bg-[var(--bg-color)]">
  <div id="root"></div>
</body>
</html>
